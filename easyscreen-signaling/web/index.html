<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>远程看屏 · 预览</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="app">
    <header class="brand">
      <h1>远程看屏</h1>
      <span class="subtitle">远程屏幕预览</span>
    </header>

    <!-- 输入阶段 -->
    <section id="join-view" class="card">
      <label for="code" class="label">输入 6 位连接码</label>
      <div class="code-input-wrap">
        <input
          id="code"
          class="code-input"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="6"
          autocomplete="off"
          placeholder="------"
        />
        <button id="clear-code-btn" class="clear-btn hidden" aria-label="清空">×</button>
      </div>
      <div style="display:flex; gap:8px; align-items:stretch;">
        <button id="connect-btn" class="primary-btn" disabled style="flex:1;">开始预览</button>
        <button id="refresh-btn" class="primary-btn hidden" title="重试连接" style="width:52px; background:var(--surface-2);" aria-label="重试">↻</button>
      </div>
      <p id="status" class="status">请输入对方手机上显示的 6 位数字</p>
      <details class="advanced">
        <summary>高级设置</summary>
        <label class="label small">TURN 服务器（可选）</label>
        <input id="turn" type="text" placeholder="turn:user:pass@host:3478" />
      </details>
      <p id="app-version" class="app-version"></p>
    </section>

    <!-- 视频阶段：全屏覆盖，按钮浮动叠加 -->
    <section id="video-view" class="hidden video-stage">
      <!-- video-canvas 容器接收手势，video 元素挂在内部做 transform -->
      <div id="video-canvas" class="video-canvas">
        <video id="remote-video" autoplay playsinline muted></video>
      </div>
      <!-- 标注叠加层：平时 pointer-events:none，标注模式下捕获指针 -->
      <canvas id="annotation-canvas" class="annotation-canvas"></canvas>
      <div id="overlay" class="overlay">
        <div class="spinner"></div>
        <p id="overlay-text">正在建立连接…</p>
      </div>

      <!-- 顶部小气泡：分辨率 + 码率 + 连接模式（不再占据底部画面） -->
      <span id="stats" class="stats floating-stats"></span>

      <!-- 缩放控制条（左下） -->
      <div id="zoom-bar" class="zoom-bar">
        <button id="zoom-out" class="floating-action zoom-btn" aria-label="缩小">−</button>
        <span id="zoom-label" class="zoom-label">100%</span>
        <button id="zoom-in" class="floating-action zoom-btn" aria-label="放大">+</button>
        <button id="zoom-reset" class="floating-action zoom-btn" aria-label="重置">⟲</button>
      </div>

      <!-- 断开时显示的"返回主页"按钮（覆盖在 overlay 内） -->
      <button id="back-home-btn" class="primary-btn hidden" style="position:absolute; bottom:25%; left:50%; transform:translateX(-50%); padding:12px 24px; z-index:21;">返回主页</button>

      <!-- 进入标注模式入口（左下，zoom-bar 上方） -->
      <button id="annotate-btn" class="floating-action floating-annotate" aria-label="标注">✎</button>

      <!-- 标注工具条（位置可切换上/右/下/左，默认隐藏） -->
      <div id="annotation-toolbar" class="annotation-toolbar pos-top hidden">
        <button class="anno-tool" data-tool="circle" title="圆圈">○</button>
        <button class="anno-tool" data-tool="arrow" title="箭头">→</button>
        <button class="anno-tool" data-tool="pen" title="自由画笔">✎</button>
        <button class="anno-tool" data-tool="ripple" title="点击波纹">·</button>
        <button class="anno-tool" data-tool="laser" title="实时指针">◉</button>
        <span class="anno-sep"></span>
        <button class="anno-color" data-color="#FF3B30" style="background:#FF3B30"></button>
        <button class="anno-color" data-color="#FFCC00" style="background:#FFCC00"></button>
        <button class="anno-color" data-color="#34C759" style="background:#34C759"></button>
        <button class="anno-color" data-color="#0A84FF" style="background:#0A84FF"></button>
        <span class="anno-sep"></span>
        <button id="anno-bounds" class="anno-text-btn" title="显示/隐藏老人端浮窗边框（诊断）">▣框</button>
        <button id="anno-pos" class="anno-text-btn" title="工具条位置">⤢位</button>
        <button id="anno-clear" class="anno-text-btn" title="清空">清空</button>
        <button id="anno-exit" class="anno-text-btn" title="退出标注">✕</button>
      </div>

      <!-- 右上角操作按钮组 -->
      <button id="fit-btn" class="floating-action floating-fit" aria-label="切换适应/充满">▣</button>
      <button id="fs-btn" class="floating-action floating-fs" aria-label="全屏">⛶</button>
      <button id="diag-btn" class="floating-action floating-diag" aria-label="诊断信息">ⓘ</button>
      <button id="reconnect-btn" class="floating-action floating-reconnect hidden" aria-label="重连">↻</button>
      <button id="disconnect-btn" class="floating-action floating-close" aria-label="断开">×</button>

      <!-- 诊断面板，默认隐藏 -->
      <div id="diag-panel" class="diag-panel hidden">
        <div class="diag-header">
          <span>诊断信息</span>
          <button id="diag-close" class="diag-close" aria-label="关闭">×</button>
        </div>
        <div id="diag-body" class="diag-body"></div>
      </div>
    </section>
  </main>

  <script src="/annotation.js"></script>
  <script src="/app.js"></script>
</body>
</html>
