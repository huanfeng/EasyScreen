services:
  easyscreen-signaling:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: easyscreen-signaling:latest
    container_name: easyscreen-signaling
    restart: unless-stopped
    # 仅绑定到 loopback：反代（1Panel OpenResty / Nginx / Caddy）负责对外暴露
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      EASYSCREEN_ADDR: ":8081"
      TZ: Asia/Shanghai
      # App 在线更新：留空则关闭更新端点
      EASYSCREEN_GITHUB_REPO: ${EASYSCREEN_GITHUB_REPO:-}
      EASYSCREEN_GITHUB_TOKEN: ${EASYSCREEN_GITHUB_TOKEN:-}
      EASYSCREEN_APP_CACHE_DIR: /app/cache
      EASYSCREEN_APP_SYNC_TTL: ${EASYSCREEN_APP_SYNC_TTL:-15m}
    volumes:
      - easyscreen-apk-cache:/app/cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  easyscreen-apk-cache:
