name: Android APK

# 触发：push 到 main（持续集成）或推送 v* 标签（正式发版）
# 所需 Secrets（Settings → Secrets and variables → Actions）：
#   EASYSCREEN_DEFAULT_SERVER_URL  默认信令地址（私有，注入 BuildConfig）
#   ANDROID_KEYSTORE_BASE64        release 签名 keystore 的 base64
#   ANDROID_KEYSTORE_PASSWORD      keystore 密码
#   ANDROID_KEY_ALIAS              key 别名
#   ANDROID_KEY_PASSWORD           key 密码
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyscreen-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，release 将回退 debug 签名"
          fi

      - name: Resolve app version
        id: ver
        run: |
          # tag 构建：versionName 取 tag（去 v 前缀）；非 tag 留空 → gradle 用默认值
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          EASYSCREEN_DEFAULT_SERVER_URL: ${{ secrets.EASYSCREEN_DEFAULT_SERVER_URL }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK with version
        run: |
          APK_DIR=easyscreen-android/app/build/outputs/apk/release
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NEW_NAME="EasyScreen-v${{ steps.ver.outputs.name }}-release.apk"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            NEW_NAME="EasyScreen-${GITHUB_REF_NAME}-${SHORT_SHA}-release.apk"
          fi
          mv "$APK_DIR/app-release.apk" "$APK_DIR/$NEW_NAME"
          echo "Renamed to: $NEW_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyscreen-release-apk
          path: easyscreen-android/app/build/outputs/apk/release/EasyScreen-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: easyscreen-android/app/build/outputs/apk/release/EasyScreen-*.apk
