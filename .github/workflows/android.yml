name: Android APK

# 触发：push 到 main（持续集成）或推送 v* 标签（正式发版）
# 所需 Secrets（Settings → Secrets and variables → Actions）：
#   EASYSCREEN_DEFAULT_SERVER_URL  默认信令地址（私有，注入 BuildConfig）
#   ANDROID_KEYSTORE_BASE64        release 签名 keystore 的 base64
#   ANDROID_KEYSTORE_PASSWORD      keystore 密码
#   ANDROID_KEY_ALIAS              key 别名
#   ANDROID_KEY_PASSWORD           key 密码
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyscreen-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，release 将回退 debug 签名"
          fi

      - name: Resolve app version
        id: ver
        run: |
          # tag 构建：versionName 取 tag（去 v 前缀）；非 tag 留空 → gradle 用默认值
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          EASYSCREEN_DEFAULT_SERVER_URL: ${{ secrets.EASYSCREEN_DEFAULT_SERVER_URL }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK with version
        run: |
          # working-directory 已是 easyscreen-android，故用相对该目录的路径
          APK_DIR=app/build/outputs/apk/release
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NEW_NAME="EasyScreen-v${{ steps.ver.outputs.name }}-release.apk"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            NEW_NAME="EasyScreen-${GITHUB_REF_NAME}-${SHORT_SHA}-release.apk"
          fi
          mv "$APK_DIR/app-release.apk" "$APK_DIR/$NEW_NAME"
          echo "Renamed to: $NEW_NAME"

      - name: Generate version.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # working-directory 已是 easyscreen-android，故用相对该目录的路径
          APK_DIR=app/build/outputs/apk/release
          APK_PATH=$(ls "$APK_DIR"/EasyScreen-*.apk | head -n1)
          VERSION_NAME="${{ steps.ver.outputs.name }}"
          VERSION_CODE="${{ github.run_number }}"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          # 通过 GitHub API 读 annotated tag 注释作为更新说明（CI checkout 的本地 tag 是 peeled commit，git tag -l 取不到注释）；含 [force] 则标记强制更新
          TAG_REF=$(gh api "repos/${{ github.repository }}/git/ref/tags/v${VERSION_NAME}" --jq '.object.type+" "+.object.sha')
          TAG_TYPE=${TAG_REF%% *}; TAG_SHA=${TAG_REF##* }
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_MSG=$(gh api "repos/${{ github.repository }}/git/tags/${TAG_SHA}" --jq '.message')
          else
            TAG_MSG=""
          fi
          if echo "$TAG_MSG" | grep -q '\[force\]'; then FORCE=true; else FORCE=false; fi
          RELEASE_NOTES=$(echo "$TAG_MSG" | sed 's/\[force\]//g' | sed ':a;N;$!ba;s/\n/ /g' | sed 's/  */ /g' | sed 's/^ *//;s/ *$//')
          # 用 jq 生成，自动转义 releaseNotes 中的引号/特殊字符，避免破坏 JSON
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg sha256 "$SHA256" \
            --argjson fileSize "$FILE_SIZE" \
            --argjson forceUpdate "$FORCE" \
            --arg releaseNotes "$RELEASE_NOTES" \
            '{versionCode: $versionCode, versionName: $versionName, sha256: $sha256, fileSize: $fileSize, forceUpdate: $forceUpdate, minSupportedVersionCode: 1, releaseNotes: $releaseNotes, downloadUrl: "/app/download"}' \
            > "$APK_DIR/version.json"
          echo "--- generated version.json ---"
          cat "$APK_DIR/version.json"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyscreen-release-apk
          path: easyscreen-android/app/build/outputs/apk/release/EasyScreen-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            easyscreen-android/app/build/outputs/apk/release/EasyScreen-*.apk
            easyscreen-android/app/build/outputs/apk/release/version.json
